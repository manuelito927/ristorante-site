<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - GREENWOOD</title>
  <link rel="stylesheet" href="/css/styles.css?v=3">

  <style>
    .gallery-wrap{
      padding: 18px;
      max-width: 980px;
      margin: 0 auto;
    }
    .gallery-title{
      margin: 6px 0 14px;
      font-size: 28px;
      letter-spacing: .02em;
    }

    .grid{
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    @media (min-width: 820px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    .ph{
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
    }
    .ph img{
      width: 100%;
      height: auto;
      display: block;
    }

    .muted{
      opacity: .75;
      font-size: 14px;
      line-height: 1.4;
    }
    .empty{
      padding: 14px;
      border: 1px dashed rgba(0,0,0,.25);
      border-radius: 14px;
      background: rgba(255,255,255,.6);
    }
  </style>
</head>
<body>

  <header class="header">
    <button id="jsHamburger" class="menu-btn" aria-label="Apri menu" aria-expanded="false">☰</button>
    <div class="logo">
      <span class="logo-mark">GW</span>
      <span class="logo-text">GREENWOOD</span>
    </div>
  </header>

  <div id="jsMenuBackdrop" class="menu-backdrop" hidden></div>

  <nav id="jsMobileMenu" class="mobile-menu" aria-label="Menu principale">
    <div class="mobile-menu__head">
      <div class="mobile-logo">
        <span class="mobile-logo__mark">GW</span>
        <span class="mobile-logo__text">GREENWOOD</span>
      </div>
    </div>

    <ul class="mobile-menu__list">
      <li><a class="mobile-menu__link" href="/menu/">MENU DIGITALE</a></li>
      <li><a class="mobile-menu__link" href="/come-funziona/">COME FUNZIONA</a></li>
      <li><a class="mobile-menu__link" href="/prenota/">PRENOTA</a></li>
      <li><a class="mobile-menu__link" href="/gallery/">GALLERY</a></li>
      <li><a class="mobile-menu__link" href="/recensioni/">RECENSIONI</a></li>
      <li><a class="mobile-menu__link" href="/">HOME</a></li>
    </ul>
  </nav>

  <section class="hero" id="pageHero" data-cover-key="gallery">
<h1 id="t_gallery_h1">Gallery</h1>
  </section>

  <main class="gallery-wrap">
<h2 class="gallery-title" id="t_gallery_title">Le nostre foto</h2>
<p class="muted" id="t_gallery_sub"></p>

    <div id="galleryGrid" class="grid" style="margin-top:16px;"></div>
  </main>

  <script src="/js/config.js"></script>
<script src="/js/lang.js"></script>


  <script>
  (async function(){
    const hero = document.getElementById("pageHero");
    if (!hero) return;

    const key = hero.dataset.coverKey || "gallery";

    try {
const base = (window.API_BASE || "").trim();
const res = await fetch(base + "/api/page/covers", { cache: "no-store" });
      const json = await res.json().catch(() => ({}));
const url = (json.data || {})[key];

      if (url && String(url).trim()) {
        hero.style.backgroundImage =
          `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("${url}")`;
        hero.style.backgroundSize = "cover";
        hero.style.backgroundPosition = "center";
        hero.style.backgroundRepeat = "no-repeat";
      }
    } catch (e) {}
  })();
  </script>

  <script>
  (function(){
    const burger = document.getElementById("jsHamburger");
    const mobileMenu = document.getElementById("jsMobileMenu");
    const backdrop = document.getElementById("jsMenuBackdrop");
    if(!burger || !mobileMenu || !backdrop) return;

    function openMenu(){
      mobileMenu.classList.add("is-open");
      backdrop.hidden = false;
      document.body.style.overflow = "hidden";
      burger.setAttribute("aria-expanded","true");
    }
    function closeMenu(){
      mobileMenu.classList.remove("is-open");
      setTimeout(() => {
        if(!mobileMenu.classList.contains("is-open")) backdrop.hidden = true;
      }, 300);
      document.body.style.overflow = "";
      burger.setAttribute("aria-expanded","false");
    }

    burger.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = mobileMenu.classList.contains("is-open");
      isOpen ? closeMenu() : openMenu();
    });

    backdrop.addEventListener("click", closeMenu);
    mobileMenu.querySelectorAll("a").forEach(a => a.addEventListener("click", closeMenu));
    document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeMenu(); });
  })();
  </script>

  <script>
  // ✅ Gallery: legge SOLO dal sito Pages Function
  (async function(){
    const grid = document.getElementById("galleryGrid");
    if(!grid) return;

    try{

const base = (window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev").trim();
const res = await fetch(base + "/api/gallery?t=" + Date.now(), { cache: "no-store" });
const js = await res.json().catch(() => ({}));
const urls = Array.isArray(js.images) ? js.images : [];

      if(!urls.length){
grid.innerHTML = `<div class="empty" id="t_gallery_empty"></div>`;
applyLangToStaticTexts(); // <-- aggiungi questa riga
        return;
      }

      grid.innerHTML = urls.map((url) => {
        const safe = String(url || "").trim();
        if(!safe) return "";
        return `
          <div class="ph">
            <img src="${escapeAttr(safe)}" alt="Foto" loading="lazy">
          </div>
        `;
      }).join("");
    }catch(e){
      grid.innerHTML = `<div class="empty">Errore nel caricamento gallery.</div>`;
    }

    function escapeAttr(s){
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[c]));
    }
  })();
  </script>
<script>
  function getLang(){
    const q = new URLSearchParams(location.search).get("lang");
    const saved = localStorage.getItem("lang");
    return (q || saved || "it").toLowerCase().startsWith("en") ? "en" : "it";
  }

  function setText(id, value){
    const el = document.getElementById(id);
    if(el) el.textContent = value || "";
  }

  function applyLangToStaticTexts(){
    const lang = getLang();
    localStorage.setItem("lang", lang);
    document.documentElement.lang = lang;

    const t = {
      it: {
        h1: "Gallery",
        title: "Le nostre foto",
        sub: "Foto gestite dall’Admin (aggiungi / togli quando vuoi).",
        empty: "Nessuna foto ancora. Vai in Admin → Gallery e aggiungile."
      },
      en: {
        h1: "Gallery",
        title: "Our photos",
        sub: "Photos managed from Admin (add / remove anytime).",
        empty: "No photos yet. Go to Admin → Gallery and add them."
      }
    }[lang];

    setText("t_gallery_h1", t.h1);
    setText("t_gallery_title", t.title);
    setText("t_gallery_sub", t.sub);

    const emptyEl = document.getElementById("t_gallery_empty");
    if(emptyEl) emptyEl.textContent = t.empty;
  }

  applyLangToStaticTexts();
</script>

<script src="/js/scroll-animate.js"></script>
</body>
</html>
