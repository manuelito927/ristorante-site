<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Come funziona - GREENWOOD</title>
  <link rel="stylesheet" href="/css/styles.css?v=3">

  <style>
/* Pulizia e Layout Professionale */
    .poster-wrap { 
      max-width: 100%; /* Permette allo sfondo di andare da lato a lato */
      margin: 0 auto; 
      padding: 0; 
    }

    .poster { 
      padding: 60px var(--pad); 
      border-bottom: 0; 
    }

    /* Alternanza Colori Sezioni */
    /* Sezione 1 e 3: Crema caldissimo */
    .poster:nth-child(odd) {
      background-color: #fcfaf7; 
    }
    /* Sezione 2 e 4: Verde Greenwood chiarissimo (minimal) */
    .poster:nth-child(even) {
      background-color: #f1f4f2; 
    }

    /* Titoli: eleganti e con il colore Greenwood scuro */
    .poster h2 {
      margin: 0 0 20px;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: #2d3a31; /* Un verde scurissimo, quasi nero, più professionale */
    }

    /* Testi */
    .poster p {
      margin: 0;
      font-size: 18px;
      line-height: 1.6;
      color: #444;
      white-space: pre-line;
      font-weight: 300; 
    }

    /* La linea verde "Greenwood" ora la facciamo risaltare di più */
    .bar { 
      width: 50px; 
      height: 3px; 
      background: #8FA998; 
      margin: 25px 0 0; 
      border-radius: 2px;
    }

    .db-text-block { margin-top: 20px; }
    
    .muted { opacity: 1; } /* Rimuovo l'opacità per massima chiarezza */

    /* Hero specifica per questa pagina */
    .hero h1 {
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: lowercase;
    }
  </style>
</head>
<body>

  <header class="header">
    <button id="jsHamburger" class="menu-btn" aria-label="Apri menu" aria-expanded="false">☰</button>
    <div class="logo">
      <span class="logo-mark">GW</span>
      <span class="logo-text">GREENWOOD</span>
    </div>
  </header>

  <div id="jsMenuBackdrop" class="menu-backdrop" hidden></div>

  <nav id="jsMobileMenu" class="mobile-menu" aria-label="Menu principale" hidden>
    <div class="mobile-menu__head">
      <div class="mobile-logo">
        <span class="mobile-logo__mark">GW</span>
        <span class="mobile-logo__text">GREENWOOD</span>
      </div>
    </div>
    <ul class="mobile-menu__list">
      <li><a class="mobile-menu__link" href="/menu/">MENU DIGITALE</a></li>
      <li><a class="mobile-menu__link" href="/come-funziona/">COME FUNZIONA</a></li>
      <li><a class="mobile-menu__link" href="/prenota/">PRENOTA</a></li>
      <li><a class="mobile-menu__link" href="/gallery/">GALLERY</a></li>
      <li><a class="mobile-menu__link" href="/recensioni/">RECENSIONI</a></li>
      <li><a class="mobile-menu__link" href="/">HOME</a></li>
    </ul>
  </nav>

<section class="hero" id="pageHero" data-cover-key="come-funziona">
  <h1 id="page_main_title">come funziona</h1>
</section>

  <main class="poster-wrap">

    <section class="poster">
      <h2 id="hours_it_title">Orari di apertura</h2>
      <p id="hours_it_text"></p>
      <p id="hours_en_text" class="db-text-block" style="font-style: italic; color: #777;"></p>
      
      <div class="db-text-block">
        <p id="phone" style="font-weight: 600; color: #151515;"></p>
        <p id="address" style="font-weight: 500;"></p>
      </div>
      
      <div class="bar"></div>
    </section>

    <section class="poster">
      <h2 id="takeaway_title">Servizio di asporto</h2>
      <p id="takeaway_text"></p>
      <div class="bar"></div>
    </section>

    <section class="poster">
      <h2 id="gluten_title">Allergie e Intolleranze</h2>
      <p id="gluten_text"></p>
      <p id="lactose_text" class="db-text-block"></p>
      <div class="bar"></div>
    </section>

    <section class="poster">
      <h2 id="pets_title">Amici a 4 zampe</h2>
      <p id="pets_text"></p>
      <div class="bar"></div>
    </section>

  </main>


<script src="/js/config.js"></script>
<script src="/js/lang.js"></script>


<script>
(async function(){
  const hero = document.getElementById("pageHero");
  if (!hero) return;

  const key = hero.dataset.coverKey || "come-funziona";

  try {
    const base = (window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev").trim();
    const res = await fetch(base + "/api/page/covers", { cache: "no-store" });
    const json = await res.json().catch(() => ({}));
    const url = (json.data || {})[key];

    if (url && String(url).trim()) {
      hero.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("${url}")`;
      hero.style.backgroundSize = "cover";
      hero.style.backgroundPosition = "center";
      hero.style.backgroundRepeat = "no-repeat";
    }
  } catch (e) {
    console.warn("Cover non caricata:", e);
  }
})();
</script>

  <script>
    /* Gestione Menu Mobile */
    (function(){
      const btn = document.getElementById("jsHamburger");
      const menu = document.getElementById("jsMobileMenu");
      const back = document.getElementById("jsMenuBackdrop");
      if(!btn || !menu || !back) return;

      function openMenu(){
        menu.hidden = false;
        menu.classList.add("is-open");
        back.hidden = false;
        btn.setAttribute("aria-expanded","true");
      }

      function closeMenu(){
        menu.classList.remove("is-open");
        setTimeout(() => { if(!menu.classList.contains("is-open")) menu.hidden = true; }, 300);
        back.hidden = true;
        btn.setAttribute("aria-expanded","false");
      }

      btn.addEventListener("click", () => {
        const isOpen = btn.getAttribute("aria-expanded") === "true";
        isOpen ? closeMenu() : openMenu();
      });

      back.addEventListener("click", closeMenu);
    })();

    /* Caricamento Dati dal Worker */
    (async function(){
      try {
const API = (window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev").trim();
        const res = await fetch(API + "/api/page/come-funziona?t=" + Date.now(), { cache: "no-store" });
        const json = await res.json();
        const d = json.data || {};

        const set = (id, val) => {
          const el = document.getElementById(id);
          if(el) el.textContent = val || "";
        };

        const lang = localStorage.getItem("lang") || "it";

set(
  "hours_it_title",
  lang === "en" ? d.hours_en_title || d.hours_it_title : d.hours_it_title
);

set(
  "hours_it_text",
  lang === "en" ? d.hours_en_text || d.hours_it_text : d.hours_it_text
);

// il paragrafo inglese sotto NON serve più
const enBlock = document.getElementById("hours_en_text");
if (enBlock) enBlock.style.display = "none";
set("phone", d.phone);
set("address", d.address);

// TITOLI + TESTI in base alla lingua
set("takeaway_title", lang === "en" ? (d.takeaway_en_title || d.takeaway_title) : d.takeaway_title);
set("takeaway_text",  lang === "en" ? (d.takeaway_en_text  || d.takeaway_text)  : d.takeaway_text);

set("gluten_title",   lang === "en" ? (d.gluten_en_title   || d.gluten_title)   : d.gluten_title);
set("gluten_text",    lang === "en" ? (d.gluten_en_text    || d.gluten_text)    : d.gluten_text);

set("lactose_text",   lang === "en" ? (d.lactose_en_text   || d.lactose_text)   : d.lactose_text);

set("pets_title",     lang === "en" ? (d.pets_en_title     || d.pets_title)     : d.pets_title);
set("pets_text",      lang === "en" ? (d.pets_en_text      || d.pets_text)      : d.pets_text);
      } catch (e) { console.error("Errore caricamento dati:", e); }
    })();
  </script>


<script src="/js/scroll-animate.js"></script>
</body>
</html>
