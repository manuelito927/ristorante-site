<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prenota - Quattrocento Gradi</title>
  <link rel="stylesheet" href="/css/styles.css?v=3">
  <style>
    .prenota-wrap{
      padding: 18px;
      max-width: 720px;
      margin: 0 auto;
    }

    .prenota-card{
      background: #fff;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 18px;
      padding: 16px;
    }

    .prenota-title{
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: .02em;
    }

    .prenota-sub{
      margin: 0 0 14px;
      opacity: .75;
      font-size: 14px;
      line-height: 1.4;
    }

    .form-row{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .field{
      flex: 1;
      min-width: 160px;
    }

    label{
      display:block;
      font-size: 12px;
      opacity: .7;
      margin: 0 0 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input, select, textarea{
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.18);
      background: #fff;
      font: inherit;
      outline: none;
    }

    textarea{ min-height: 90px; resize: vertical; }

    .btn-primary{
      width: 100%;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.18);
      background: #151515;
      color: #fff;
      cursor: pointer;
      font: inherit;
    }

    .note-small{
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <button id="jsHamburger" class="menu-btn" aria-label="Apri menu" aria-expanded="false">☰</button>

    <div class="logo">
      <span class="logo-mark">+400°</span>
      <span class="logo-text">QUATTROCENTO GRADI</span>
    </div>
  </header>

  <!-- MENU MOBILE -->
  <div id="jsMenuBackdrop" class="menu-backdrop" hidden></div>

  <nav id="jsMobileMenu" class="mobile-menu" aria-label="Menu principale">
    <div class="mobile-menu__head">
      <div class="mobile-logo">
        <span class="mobile-logo__mark">+400°</span>
        <span class="mobile-logo__text">QUATTROCENTO GRADI</span>
      </div>
    </div>

    <ul class="mobile-menu__list">
      <li><a class="mobile-menu__link" href="/menu/">MENU DIGITALE</a></li>
      <li><a class="mobile-menu__link" href="/come-funziona/">COME FUNZIONA</a></li>
      <li><a class="mobile-menu__link" href="/prenota/">PRENOTA</a></li>
      <li><a class="mobile-menu__link" href="#">GALLERY</a></li>
      <li><a class="mobile-menu__link" href="#">RECENSIONI</a></li>
      <li><a class="mobile-menu__link" href="/">HOME</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Prenota</h1>
  </section>

  <!-- CONTENT -->
  <main class="prenota-wrap">
    <div class="prenota-card">
      <h2 class="prenota-title">Richiedi un tavolo</h2>
      <p class="prenota-sub">
        Compila i dati qui sotto. La prenotazione verrà confermata dal locale.
      </p>

      <form id="prenotaForm">
        <div class="form-row">
          <div class="field">
            <label>Data</label>
            <input name="date" type="date" required>
          </div>
          <div class="field">
            <label>Ora</label>
            <input name="time" type="time" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Persone</label>
            <input name="people" type="number" min="1" value="2" required>
          </div>
          <div class="field">
            <label>Telefono</label>
            <input name="phone" type="tel" placeholder="Es. 3331234567" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Nome e cognome</label>
            <input name="name" type="text" placeholder="Es. Mario Rossi" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Note (opzionale)</label>
            <textarea name="notes" placeholder="Allergie, passeggino, richiesta tavolo, ecc."></textarea>
          </div>
        </div>

        <button class="btn-primary" type="submit">Invia richiesta</button>

        <div class="note-small" id="noteMsg">
          * La richiesta verrà inviata al sistema del locale.
        </div>
      </form>
    </div>
  </main>

  <!-- ✅ serve per window.API_BASE -->
  <script src="/js/config.js"></script>

  <!-- JS: menu mobile + INVIO al Worker -->
  <script>
    (function(){
      const btn = document.getElementById("jsHamburger");
      const menu = document.getElementById("jsMobileMenu");
      const back = document.getElementById("jsMenuBackdrop");

      function openMenu(){
        menu.classList.add("is-open");
        back.hidden = false;
        btn.setAttribute("aria-expanded","true");
      }
      function closeMenu(){
        menu.classList.remove("is-open");
        back.hidden = true;
        btn.setAttribute("aria-expanded","false");
      }

      if(btn && menu && back){
        btn.addEventListener("click", () => {
          const isOpen = btn.getAttribute("aria-expanded") === "true";
          isOpen ? closeMenu() : openMenu();
        });

        back.addEventListener("click", closeMenu);
        menu.querySelectorAll("a").forEach(a => a.addEventListener("click", closeMenu));
      }

      // ===== INVIO REALE =====
      const form = document.getElementById("prenotaForm");
      const noteMsg = document.getElementById("noteMsg");

      if(form){
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const API = window.API_BASE || ""; // se non c'è, usa relative path
          const btnSubmit = form.querySelector('button[type="submit"]');

          const fd = new FormData(form);
          const payload = {
            name: String(fd.get("name") || "").trim(),
            phone: String(fd.get("phone") || "").trim(),
            people: Number(fd.get("people") || 2),
            date: String(fd.get("date") || "").trim(), // YYYY-MM-DD
            time: String(fd.get("time") || "").trim(), // HH:MM
            notes: String(fd.get("notes") || "").trim()
          };

          if (!payload.name || !payload.phone || !payload.date || !payload.time) {
            alert("Compila tutti i campi obbligatori.");
            return;
          }
          if (!Number.isFinite(payload.people) || payload.people < 1 || payload.people > 30) {
            alert("Numero persone non valido.");
            return;
          }

          try {
            if(btnSubmit){
              btnSubmit.disabled = true;
              btnSubmit.textContent = "Invio...";
            }
            if(noteMsg) noteMsg.textContent = "Invio in corso...";

            const res = await fetch(API + "/api/reservations", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload)
            });

            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));

            alert("✅ Richiesta inviata! Ti contatteremo per conferma.");
            form.reset();
            form.querySelector('[name="people"]').value = 2;
            if(noteMsg) noteMsg.textContent = "✅ Inviata correttamente.";
          } catch (err) {
            alert("❌ Errore invio: " + (err.message || "sconosciuto"));
            if(noteMsg) noteMsg.textContent = "❌ Errore durante l'invio.";
          } finally {
            if(btnSubmit){
              btnSubmit.disabled = false;
              btnSubmit.textContent = "Invia richiesta";
            }
          }
        });
      }
    })();
  </script>

</body>
</html>
