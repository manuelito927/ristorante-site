<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Menu</title>
  <link rel="stylesheet" href="/css/styles.css?v=1" />
  <style>
    .wrap{ max-width: 980px; margin: 0 auto; padding: 18px; }
    .card{ background:#fff6ee; border:1px solid rgba(0,0,0,.12); border-radius:14px; padding:14px; }
    .row{ display:flex; gap:12px; flex-wrap:wrap; }
    input, select, textarea{
      width:100%; padding:10px 12px; border-radius:12px;
      border:1px solid rgba(0,0,0,.18); background:#fff; font:inherit;
    }
    textarea{ min-height:70px; resize:vertical; }
    .btn{
      padding:10px 14px; border-radius:12px; border:1px solid rgba(0,0,0,.18);
      background:#151515; color:#fff; cursor:pointer; font:inherit;
    }
    .btn.secondary{ background:#fff; color:#151515; }
    .btn.danger{ background:#b42318; border-color:#b42318; }
    .grid{ display:grid; grid-template-columns: 1fr; gap:12px; margin-top:14px; }
    @media (min-width: 900px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }
    .item-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    note{ display:block; opacity:.7; font-size:14px; margin-top:8px; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .pill{ padding:6px 10px; border-radius:999px; border:1px solid rgba(0,0,0,.12); background: rgba(246,241,234,.92); }
    .hidden{ display:none !important; }
  </style>
</head>
<body>

<header class="header">
  <a href="/" style="text-decoration:none;color:inherit;">←</a>
  <div class="logo">+400° <span>ADMIN</span></div>
</header>

<div class="wrap">

  <div class="topbar">
    <div class="pill" id="status">Non connesso</div>
    <button class="btn secondary" id="logoutBtn">Esci</button>
  </div>

  <!-- LOGIN -->
  <section class="card" id="loginCard">
    <h2 style="margin:0 0 10px;">Accesso</h2>
    <div class="row">
      <div style="flex:1; min-width:240px;">
        <label>Token Admin</label>
        <input id="tokenInput" type="password" placeholder="Incolla il token (ADMIN_TOKEN)" />
        <note>Questo token lo decidi tu in Cloudflare Worker → Variables → ADMIN_TOKEN</note>
      </div>
      <div style="align-self:flex-end;">
        <button class="btn" id="loginBtn">Entra</button>
      </div>
    </div>
  </section>

  <!-- FORM NUOVO PIATTO -->
  <section class="card hidden" id="appCard">
    <h2 style="margin:0 0 10px;">Aggiungi prodotto</h2>
    <div class="row">
      <div style="flex:1; min-width:220px;">
        <label>Nome *</label>
        <input id="name" placeholder="Es. Margherita" />
      </div>
      <div style="width:180px; min-width:160px;">
        <label>Prezzo (€) *</label>
        <input id="price" type="number" step="0.01" placeholder="6.50" />
      </div>
      <div style="flex:1; min-width:220px;">
        <label>Categoria</label>
        <input id="category" placeholder="Es. Pizze" />
      </div>
      <div style="width:140px; min-width:120px;">
        <label>Posizione</label>
        <input id="position" type="number" step="1" value="0" />
      </div>
      <div style="flex:1; min-width:240px;">
        <label>Immagine (URL)</label>
        <input id="image_url" placeholder="https://..." />
      </div>
      <div style="flex:1; min-width:280px;">
        <label>Descrizione</label>
        <textarea id="description" placeholder="Ingredienti / note"></textarea>
      </div>
      <div style="width:180px; min-width:160px;">
        <label>Disponibile</label>
        <select id="is_available">
          <option value="true" selected>Si</option>
          <option value="false">No</option>
        </select>
      </div>
      <div style="align-self:flex-end;">
        <button class="btn" id="createBtn">Aggiungi</button>
      </div>
    </div>

    <hr style="border:0;border-top:1px solid rgba(0,0,0,.12); margin:14px 0;"/>

    <h2 style="margin:0 0 10px;">Prodotti</h2>
    <div class="grid" id="itemsGrid"></div>
  </section>

</div>

<script src="/js/config.js"></script>
<script src="/js/admin.js?v=1"></script>
</body>
</html>
