<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Digitale - Greenwood</title>
  <link rel="stylesheet" href="/css/styles.css?v=3">
</head>
<body>

  <header class="header">
    <button id="jsHamburger" class="menu-btn" aria-label="Apri menu" aria-expanded="false">☰</button>

    <div class="logo">
      <span class="logo-mark">GW</span>
      <span class="logo-text">GREENWOOD</span>
    </div>
  </header>

  <div class="langbar" aria-label="Selettore lingua">
    <button class="langbtn" type="button" data-lang="it" aria-label="Italiano">🇮🇹 IT</button>
    <button class="langbtn" type="button" data-lang="en" aria-label="English">🇬🇧 EN</button>
  </div>

  <div id="jsMenuBackdrop" class="menu-backdrop" hidden></div>

  <nav id="jsMobileMenu" class="mobile-menu" aria-label="Menu principale">
    <div class="mobile-menu__head">
      <div class="mobile-logo">
        <span class="mobile-logo__mark">GW</span>
        <span class="mobile-logo__text">GREENWOOD</span>
      </div>
    </div>

    <ul class="mobile-menu__list">
      <li><a class="mobile-menu__link" href="/menu/">MENU DIGITALE</a></li>
      <li><a class="mobile-menu__link" href="/come-funziona/">COME FUNZIONA</a></li>
      <li><a class="mobile-menu__link" href="/prenota/">PRENOTA</a></li>
      <li><a class="mobile-menu__link" href="/gallery/">GALLERY</a></li>
      <li><a class="mobile-menu__link" href="/recensioni/">RECENSIONI</a></li>
      <li><a class="mobile-menu__link" href="/">HOME</a></li>
    </ul>
  </nav>

  <section class="hero" id="pageHero" data-cover-key="menu">
    <h1>Menu digitale</h1>
  </section>

  <main class="menu" id="menu-digitale"></main>

  <script src="/js/config.js"></script>

  <!-- ✅ COVER -->
  <script>
  (async function(){
    const hero = document.getElementById("pageHero");
    if (!hero) return;

    const key = hero.dataset.coverKey || "menu";

    try {
      const res = await fetch("/api/page/covers", { cache: "no-store" });
      const json = await res.json().catch(() => ({}));
      const url = json[key];

      if (url && String(url).trim()) {
        hero.style.backgroundImage =
          `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("${url}")`;
        hero.style.backgroundSize = "cover";
        hero.style.backgroundPosition = "center";
        hero.style.backgroundRepeat = "no-repeat";
      }
    } catch(e){
      console.warn("Cover non caricata:", e);
    }
  })();
  </script>

  <!-- ✅ MENU DIGITALE -->
  <script src="/js/menu.js?v=4"></script>

  <!-- ✅ HAMBURGER MENU -->
  <script>
  (function(){
    const btn  = document.getElementById("jsHamburger");
    const menu = document.getElementById("jsMobileMenu");
    const back = document.getElementById("jsMenuBackdrop");
    if(!btn || !menu || !back) return;

    function closeMenu(){
  menu.classList.remove("is-open");
  back.hidden = true;
  back.style.display = "none";          // ✅ toglie overlay
  btn.setAttribute("aria-expanded","false");
  document.body.style.overflow = "";    // ✅ riattiva scroll
}

function openMenu(){
  menu.classList.add("is-open");
  back.hidden = false;
  back.style.display = "block";         // ✅ mostra overlay
  btn.setAttribute("aria-expanded","true");
  document.body.style.overflow = "hidden"; // ✅ blocca scroll
}


    closeMenu();

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const isOpen = btn.getAttribute("aria-expanded") === "true";
      isOpen ? closeMenu() : openMenu();
    });

    back.addEventListener("click", closeMenu);
    menu.querySelectorAll("a").forEach(a => a.addEventListener("click", closeMenu));
  })();
  </script>

</body>
</html>
