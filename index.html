<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GREENWOOD</title>

  <link rel="stylesheet" href="/css/styles.css?v=2">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <button id="jsHamburger" class="menu-btn" aria-label="Apri menu" aria-expanded="false">☰</button>

    <div class="logo">
      <span class="logo-mark">+400°</span>
      <span class="logo-text">QUATTROCENTO GRADI</span>
    </div>
  </header>

  <!-- MENU MOBILE (overlay) -->
  <div id="jsMenuBackdrop" class="menu-backdrop" hidden></div>

  <nav id="jsMobileMenu" class="mobile-menu" aria-label="Menu principale">
    <div class="mobile-menu__head">
      <div class="mobile-logo">
        <span class="mobile-logo__mark">+400°</span>
        <span class="mobile-logo__text">QUATTROCENTO GRADI</span>
      </div>
    </div>

    <ul class="mobile-menu__list">
      <li><a class="mobile-menu__link" href="#menu-digitale">MENU DIGITALE</a></li>
      <li><a class="mobile-menu__link" href="#english-menu">ENGLISH MENU</a></li>
      <li><a class="mobile-menu__link" href="#come-funziona">COME FUNZIONA</a></li>
      <li><a class="mobile-menu__link" href="#prenota">PRENOTA</a></li>
      <li><a class="mobile-menu__link" href="#gallery">GALLERY</a></li>
      <li><a class="mobile-menu__link" href="#contatti">CONTATTI</a></li>
      <li><a class="mobile-menu__link" href="#riconoscimenti">RICONOSCIMENTI</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>All you need<br>is love<br>and food</h1>
  </section>

  <!-- MENU (DINAMICO) -->
  <main class="menu" id="menu-digitale"></main>

  <!-- FOOTER -->
  <footer class="note">
    <p>*Attualmente il menu non dispone di opzioni senza glutine.</p>
  </footer>

  <!-- JS -->
  <script src="/js/config.js"></script>
  <script src="/js/menu.js?v=2"></script>
</body>
</html>
