<script src="/js/config.js"></script>
<script>
(function(){
  // lingua globale (default IT)
  const lang = (localStorage.getItem("lang") || "it").toLowerCase();
  const btn = document.getElementById("langBtn");
if (btn) {
  btn.classList.toggle("is-it", lang === "it");
  btn.classList.toggle("is-en", lang === "en");
}

  // toggle lingua
  if (btn) {
    btn.addEventListener("click", () => {
      const next = (localStorage.getItem("lang") || "it") === "it" ? "en" : "it";
      localStorage.setItem("lang", next);
      location.reload();
    });
  }

  // traduzioni fisse (quelle scritte in HTML)
  const T = {
    it: {
      menu: "MENU DIGITALE",
      how: "COME FUNZIONA",
      book: "PRENOTA",
      gallery: "GALLERY",
      reviews: "RECENSIONI",
      home: "HOME",
      offers: "Le nostre proposte"
    },
    en: {
      menu: "DIGITAL MENU",
      how: "HOW IT WORKS",
      book: "BOOK A TABLE",
      gallery: "GALLERY",
      reviews: "REVIEWS",
      home: "HOME",
      offers: "Our suggestions"
    }
  };

  const tr = T[lang] || T.it;

  // cambia titolo sezione strip
  const titleEl = document.querySelector(".piatti-title");
  if (titleEl) titleEl.textContent = tr.offers;

  // cambia voci menu mobile (ordine come nel tuo html)
  const links = document.querySelectorAll(".mobile-menu__list .mobile-menu__link");
  if (links && links.length >= 6) {
    links[0].textContent = tr.menu;
    links[1].textContent = tr.how;
    links[2].textContent = tr.book;
    links[3].textContent = tr.gallery;
    links[4].textContent = tr.reviews;
    links[5].textContent = tr.home;
  }
})();
</script>
<script>
(async function(){
  const hero = document.getElementById("pageHero");
  if (!hero) return;

  const key = hero.dataset.coverKey || "home";

  try {
    const base = (window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev").trim();
    const res = await fetch(base + "/api/page/covers", { cache: "no-store" });
    const json = await res.json().catch(() => ({}));

    let covers = (json.data || {})[key];

    // normalizza: stringa → array
    if (typeof covers === "string") covers = [covers];
    if (!Array.isArray(covers) || !covers.length) return;

    // ✅ overlay per effetto "switch morbido"
    hero.style.position = hero.style.position || "relative";
    hero.style.overflow = "hidden";

    let overlay = hero.querySelector(".hero-cover-overlay");
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.className = "hero-cover-overlay";
      overlay.style.position = "absolute";
      overlay.style.inset = "0";
      overlay.style.backgroundSize = "cover";
      overlay.style.backgroundPosition = "center";
      overlay.style.backgroundRepeat = "no-repeat";
      overlay.style.opacity = "0";
      overlay.style.transition = "opacity 0.8s ease"; // ✅ morbido
      overlay.style.pointerEvents = "none";
      hero.appendChild(overlay);
    }

    let index = 0;
    const intervalMs = 1300; // ✅ 1.3 secondi

    function setHeroBg(url){
      hero.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)), url("${url}")`;
      hero.style.backgroundSize = "cover";
      hero.style.backgroundPosition = "center";
      hero.style.backgroundRepeat = "no-repeat";
    }

    function transitionTo(nextUrl){
      // metto la nuova immagine nell'overlay e faccio fade-in
      overlay.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)), url("${nextUrl}")`;

      overlay.style.opacity = "1";

      // quando finisce il fade, rendo l'overlay la base e lo spengo
      setTimeout(() => {
        setHeroBg(nextUrl);
        overlay.style.opacity = "0";
      }, 800); // uguale alla transition 0.8s
    }

    // prima immagine
    setHeroBg(covers[index]);

    // autoplay
    setInterval(() => {
      index = (index + 1) % covers.length;
      transitionTo(covers[index]);
    }, intervalMs);

  } catch(e){
    console.warn("Cover non caricata:", e);
  }
})();
</script>

<script>
(async function(){
  try {
const res = await fetch((window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev") + "/api/page/home", { cache: "no-store" });
    const j = await res.json();
    const data = j.data || {};
    const cards = Array.isArray(data.cards) ? data.cards : [];

    const wrap = document.getElementById("homeCards");
    if(!wrap) return;

const lang = (localStorage.getItem("lang") || "it").toLowerCase();

wrap.innerHTML = cards.map(c => {
const title = (lang === "en" ? (c.title_en || c.title_it) : (c.title_it || c.title_en)) || "";
const text  = (lang === "en" ? (c.text_en  || c.text_it)  : (c.text_it  || c.text_en))  || "";
const buttonText = (lang === "en" ? (c.button_en || c.button_it) : (c.button_it || c.button_en)) || "SCOPRI";

  return `
    <div class="hero-card home-hero-card">
      <h1>${title}</h1>
      <p>${text}</p>
      <a class="heroBtn" href="${c.href || "#"}">${buttonText}</a>
    </div>
  `;
}).join("");

  } catch(e){
    console.warn("Home cards non caricate", e);
  }
})();
</script>

<script>
  (function(){
    // ====== CONFIG ======
    const API = (window.API_BASE || "").trim();  // arriva da /js/config.js se lo hai
    const WHATSAPP_NUMBER = "+393497838317";      // <-- METTI QUI IL NUMERO DEL RISTORANTE (solo cifre, es: 39...)
    // ====================

    // MENU MOBILE (uguale a prima)
    const btn = document.getElementById("jsHamburger");
    const menu = document.getElementById("jsMobileMenu");
    const back = document.getElementById("jsMenuBackdrop");

function closeMenu(){
  menu.classList.remove("is-open");
  back.hidden = true;
  back.style.display = "none";          // ✅ forza via overlay
  btn.setAttribute("aria-expanded","false");
  document.body.style.overflow = "";    // ✅ riattiva scroll
}

function openMenu(){
  menu.classList.add("is-open");
  back.hidden = false;
  back.style.display = "block";         // ✅ mostra overlay
  btn.setAttribute("aria-expanded","true");
  document.body.style.overflow = "hidden"; // ✅ blocca scroll (opzionale)
}

    if(btn && menu && back){
      btn.addEventListener("click", () => {
        const isOpen = btn.getAttribute("aria-expanded") === "true";
        isOpen ? closeMenu() : openMenu();
      });
      back.addEventListener("click", closeMenu);
menu.querySelectorAll("a").forEach(a => {
  a.addEventListener("click", (e) => {
    const href = a.getAttribute("href") || "";

    // sempre chiudi il menu
    closeMenu();

    if (!href || href === "#") return;

    // ✅ tutte le altre pagine (menu/gallery/prenota ecc.)
    e.preventDefault();
    setTimeout(() => { window.location.href = href; }, 80);
  });
});
    }



  })();
</script>

<script>
(async function () {
  const base = (window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev").trim();

  const titleEl = document.querySelector(".piatti-title");
  const wrap = document.getElementById("menuStrip");
  const cats = document.getElementById("stripCats");

  // crea 1 tab bottone
  function mkBtn(key, label, active){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cat-btn" + (active ? " is-active" : "");
    b.dataset.key = key;
    b.textContent = label || key;
    return b;
  }

  async function loadStrip(key) {
    try {
      const res = await fetch(base + "/api/strip/" + encodeURIComponent(key), { cache: "no-store" });
      const json = await res.json();
      const data = json.data;

      // se non esiste, svuota
      if (!data) {
        if (titleEl) titleEl.textContent = "";
        if (wrap) wrap.innerHTML = "";
        return;
      }


      if (wrap) {
        wrap.innerHTML = (data.items || []).map(it => `
          <div class="piatto-card">
            <img src="${it.image_url}" alt="${it.name}">
            <span>${it.name}</span>
          </div>
        `).join("");
      }
    } catch (e) {
      console.warn("Strip non caricata", e);
    }
  }

  // 1) chiedi al worker la lista delle categorie
  // useremo: GET /api/strip (che creeremo nel worker al PASSO 2)
  let keys = [];
  try {
    const res = await fetch(base + "/api/strip", { cache: "no-store" });
    const j = await res.json();
    keys = Array.isArray(j.keys) ? j.keys : [];
  } catch {}

  // fallback se lista vuota
  if (!keys.length) keys = ["pizze"];
// 2) render tabs (usa TITLE invece della key)
if (cats) {
  cats.innerHTML = "";

  const labels = {};
  for (const k of keys) {
    try {
      const r = await fetch(base + "/api/strip/" + encodeURIComponent(k), { cache: "no-store" });
      const jj = await r.json();
      const d = jj && jj.data ? jj.data : null;
      labels[k] = (d && d.title && String(d.title).trim()) ? String(d.title).trim() : k;
    } catch {
      labels[k] = k;
    }
  }

  keys.forEach((k, i) => cats.appendChild(mkBtn(k, labels[k], i === 0)));

  cats.addEventListener("click", (e) => {
    const btn = e.target.closest(".cat-btn");
    if (!btn) return;

    cats.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("is-active"));
    btn.classList.add("is-active");

    loadStrip(btn.dataset.key);
  });
}

  // default: prima categoria
  loadStrip(keys[0]);
})();
</script>
