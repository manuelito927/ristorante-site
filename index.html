<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GREENWOOD</title>

  <link rel="stylesheet" href="/css/styles.css?v=2">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <button id="jsHamburger"
            class="menu-btn"
            aria-label="Apri menu"
            aria-expanded="false">
      ☰
    </button>

    <div class="logo">
      <span class="logo-mark">GW•</span>
      <span class="logo-text">GREENWOOD</span>
    </div>
  </header>

  <!-- BACKDROP -->
  <div id="jsMenuBackdrop" class="menu-backdrop" hidden></div>

  <!-- MENU MOBILE -->
  <nav id="jsMobileMenu" class="mobile-menu" aria-label="Menu principale">
    <div class="mobile-menu__head">
      <div class="mobile-logo">
        <span class="mobile-logo__mark">+400°</span>
        <span class="mobile-logo__text">QUATTROCENTO GRADI</span>
      </div>
    </div>

    <ul class="mobile-menu__list">
      <!-- QUESTO PORTA AL MENU -->
      <li>
        <a class="mobile-menu__link" href="#menu-digitale">
          MENU DIGITALE
        </a>
      </li>

      <!-- gli altri per ora NON fanno nulla -->
      <li><a class="mobile-menu__link" href="#">ENGLISH MENU</a></li>
      <li><a class="mobile-menu__link" href="#">COME FUNZIONA</a></li>
      <li><a class="mobile-menu__link" href="#">PRENOTA</a></li>
      <li><a class="mobile-menu__link" href="#">GALLERY</a></li>
      <li><a class="mobile-menu__link" href="#">CONTATTI</a></li>
      <li><a class="mobile-menu__link" href="#">RICONOSCIMENTI</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>All you need<br>is love<br>and food</h1>
  </section>

  <!-- MENU DIGITALE (TARGET) -->
  <main class="menu" id="menu-digitale"></main>

  <!-- FOOTER -->
  <footer class="note">
    <p>*Attualmente il menu non dispone di opzioni senza glutine.</p>
  </footer>

  <!-- JS -->
  <script src="/js/config.js"></script>
  <script src="/js/menu.js?v=2"></script>

</body>
</html>
