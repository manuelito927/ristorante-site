<section class="hero" id="pageHero" data-cover-key="home"></section>

<script src="/js/config.js"></script>
<script>
(async function(){
  const hero = document.getElementById("pageHero");
  if(!hero) return;

  const key = hero.dataset.coverKey || "home";

  try {
    const base = (window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev").trim();
    const res = await fetch(base + "/api/page/covers", { cache: "no-store" });
    const json = await res.json().catch(() => ({}));

    const url = (json.data || {})[key];  // ✅ QUESTA È LA FIX

    if (url && String(url).trim()) {
      hero.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,.3), rgba(0,0,0,.3)), url("${url}")`;
      hero.style.backgroundSize = "cover";
      hero.style.backgroundPosition = "center";
      hero.style.backgroundRepeat = "no-repeat";
    }
  } catch(e){
    console.warn("Cover non caricata:", e);
  }
})();
</script>

<script>
(async function(){
  try {
const res = await fetch((window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev") + "/api/page/home", { cache: "no-store" });
    const j = await res.json();
    const data = j.data || {};
    const cards = Array.isArray(data.cards) ? data.cards : [];

    const wrap = document.getElementById("homeCards");
    if(!wrap) return;

    wrap.innerHTML = cards.map(c => `
<div class="hero-card home-hero-card">
        <h1>${c.title || ""}</h1>
        <p>${c.text || ""}</p>
        <a class="heroBtn" href="${c.href || "#"}">${c.buttonText || "SCOPRI"}</a>
      </div>
    `).join("");

  } catch(e){
    console.warn("Home cards non caricate", e);
  }
})();
</script>

<script>
  (function(){
    // ====== CONFIG ======
    const API = (window.API_BASE || "").trim();  // arriva da /js/config.js se lo hai
    const WHATSAPP_NUMBER = "+393921541210";      // <-- METTI QUI IL NUMERO DEL RISTORANTE (solo cifre, es: 39...)
    // ====================

    // MENU MOBILE (uguale a prima)
    const btn = document.getElementById("jsHamburger");
    const menu = document.getElementById("jsMobileMenu");
    const back = document.getElementById("jsMenuBackdrop");

function closeMenu(){
  menu.classList.remove("is-open");
  back.hidden = true;
  back.style.display = "none";          // ✅ forza via overlay
  btn.setAttribute("aria-expanded","false");
  document.body.style.overflow = "";    // ✅ riattiva scroll
}

function openMenu(){
  menu.classList.add("is-open");
  back.hidden = false;
  back.style.display = "block";         // ✅ mostra overlay
  btn.setAttribute("aria-expanded","true");
  document.body.style.overflow = "hidden"; // ✅ blocca scroll (opzionale)
}

    if(btn && menu && back){
      btn.addEventListener("click", () => {
        const isOpen = btn.getAttribute("aria-expanded") === "true";
        isOpen ? closeMenu() : openMenu();
      });
      back.addEventListener("click", closeMenu);
menu.querySelectorAll("a").forEach(a => {
  a.addEventListener("click", (e) => {
    const href = a.getAttribute("href") || "";

    // sempre chiudi il menu
    closeMenu();

    if (!href || href === "#") return;

    // ✅ tutte le altre pagine (menu/gallery/prenota ecc.)
    e.preventDefault();
    setTimeout(() => { window.location.href = href; }, 80);
  });
});
    }



  })();
</script>

<script>
(async function () {
  const base = (window.API_BASE || "https://still-haze-01c8.filosofiaefficace.workers.dev").trim();

  const titleEl = document.querySelector(".piatti-title");
  const wrap = document.getElementById("menuStrip");
  const cats = document.getElementById("stripCats");

  // crea 1 tab bottone
  function mkBtn(key, label, active){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cat-btn" + (active ? " is-active" : "");
    b.dataset.key = key;
    b.textContent = label || key;
    return b;
  }

  async function loadStrip(key) {
    try {
      const res = await fetch(base + "/api/strip/" + encodeURIComponent(key), { cache: "no-store" });
      const json = await res.json();
      const data = json.data;

      // se non esiste, svuota
      if (!data) {
        if (titleEl) titleEl.textContent = "";
        if (wrap) wrap.innerHTML = "";
        return;
      }


      if (wrap) {
        wrap.innerHTML = (data.items || []).map(it => `
          <div class="piatto-card">
            <img src="${it.image_url}" alt="${it.name}">
            <span>${it.name}</span>
          </div>
        `).join("");
      }
    } catch (e) {
      console.warn("Strip non caricata", e);
    }
  }

  // 1) chiedi al worker la lista delle categorie
  // useremo: GET /api/strip (che creeremo nel worker al PASSO 2)
  let keys = [];
  try {
    const res = await fetch(base + "/api/strip", { cache: "no-store" });
    const j = await res.json();
    keys = Array.isArray(j.keys) ? j.keys : [];
  } catch {}

  // fallback se lista vuota
  if (!keys.length) keys = ["pizze"];
// 2) render tabs (usa TITLE invece della key)
if (cats) {
  cats.innerHTML = "";

  const labels = {};
  for (const k of keys) {
    try {
      const r = await fetch(base + "/api/strip/" + encodeURIComponent(k), { cache: "no-store" });
      const jj = await r.json();
      const d = jj && jj.data ? jj.data : null;
      labels[k] = (d && d.title && String(d.title).trim()) ? String(d.title).trim() : k;
    } catch {
      labels[k] = k;
    }
  }

  keys.forEach((k, i) => cats.appendChild(mkBtn(k, labels[k], i === 0)));

  cats.addEventListener("click", (e) => {
    const btn = e.target.closest(".cat-btn");
    if (!btn) return;

    cats.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("is-active"));
    btn.classList.add("is-active");

    loadStrip(btn.dataset.key);
  });
}

  // default: prima categoria
  loadStrip(keys[0]);
})();
</script>

</body>
