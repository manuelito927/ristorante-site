<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recensioni - GREENWOOD</title>
  <link rel="stylesheet" href="/css/styles.css?v=3">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <button id="jsHamburger" class="menu-btn" aria-label="Apri menu" aria-expanded="false">☰</button>

    <div class="logo">
      <span class="logo-mark">GW</span>
      <span class="logo-text">GREENWOOD</span>
    </div>
  </header>

  <!-- MENU MOBILE -->
  <div id="jsMenuBackdrop" class="menu-backdrop" hidden></div>

  <nav id="jsMobileMenu" class="mobile-menu" aria-label="Menu principale">
    <div class="mobile-menu__head">
      <div class="mobile-logo">
        <span class="mobile-logo__mark">GW</span>
        <span class="mobile-logo__text">GREENWOOD</span>
      </div>
    </div>

    <ul class="mobile-menu__list">
      <li><a class="mobile-menu__link" href="/menu/">MENU DIGITALE</a></li>
      <li><a class="mobile-menu__link" href="/come-funziona/">COME FUNZIONA</a></li>
      <li><a class="mobile-menu__link" href="/prenota/">PRENOTA</a></li>
      <li><a class="mobile-menu__link" href="/gallery/">GALLERY</a></li>
      <li><a class="mobile-menu__link" href="/recensioni/">RECENSIONI</a></li>
      <li><a class="mobile-menu__link" href="/">HOME</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero" id="pageHero" data-cover-key="recensioni">
    <h1>Recensioni</h1>
  </section>

 <main style="max-width:720px;margin:0 auto;padding:18px;">
<div class="card" style="padding:16px;">
  <h2 style="margin:0 0 10px;">Cosa dicono di noi</h2>

  <p id="revText" style="margin:0 0 16px;opacity:.75;">
    Caricamento...
  </p>

  <a
    id="revReadBtn"
    class="btn-primary"
    style="display:block;text-align:center;text-decoration:none;"
    href="#"
    target="_blank" rel="noopener"
  >
    ⭐ Leggi recensioni su Google
  </a>

  <a
    id="revWriteBtn"
    style="display:block;text-align:center;margin-top:12px;"
    href="#"
    target="_blank" rel="noopener"
  >
    ✍️ Lascia una recensione
  </a>
</div>

  <!-- ✅ serve per window.API_BASE -->
  <script src="/js/config.js"></script>

  <!-- cover hero (come le altre pagine) -->
  <script>
  (async function(){
    const hero = document.getElementById("pageHero");
    if (!hero) return;
    const key = hero.dataset.coverKey || "recensioni";
    try {
      const res = await fetch("/api/page/covers", { cache: "no-store" });
      const json = await res.json().catch(() => ({}));
      const url = json[key];
      if (url && String(url).trim()) {
        hero.style.backgroundImage =
          `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("${url}")`;
        hero.style.backgroundSize = "cover";
        hero.style.backgroundPosition = "center";
        hero.style.backgroundRepeat = "no-repeat";
      }
    } catch (e) {
      console.warn("Cover non caricata:", e);
    }
  })();
  </script>

  <!-- JS menu mobile -->
  <script>
    (function(){
      const btn = document.getElementById("jsHamburger");
      const menu = document.getElementById("jsMobileMenu");
      const back = document.getElementById("jsMenuBackdrop");

      function openMenu(){
        menu.classList.add("is-open");
        back.hidden = false;
        btn.setAttribute("aria-expanded","true");
      }
      function closeMenu(){
        menu.classList.remove("is-open");
        back.hidden = true;
        btn.setAttribute("aria-expanded","false");
      }

      if(btn && menu && back){
        btn.addEventListener("click", () => {
          const isOpen = btn.getAttribute("aria-expanded") === "true";
          isOpen ? closeMenu() : openMenu();
        });

        back.addEventListener("click", closeMenu);
        menu.querySelectorAll("a").forEach(a => a.addEventListener("click", closeMenu));
      }
    })();
  </script>

<script>
(async function(){
  try {
    const res = await fetch("/api/page/recensioni", { cache: "no-store" });
    const j = await res.json().catch(() => ({}));
    const d = j.data || {};

    const textIt = (d.text_it || "").trim();
    const textEn = (d.text_en || "").trim();

    const googleLink = (d.google_link || "").trim();
    const writeLink = (d.write_link || "").trim();

    // lingua semplice: se browser inizia con "en" usa EN altrimenti IT
    const lang = (navigator.language || "it").toLowerCase().startsWith("en") ? "en" : "it";

    const revText = document.getElementById("revText");
    const readBtn = document.getElementById("revReadBtn");
    const writeBtn = document.getElementById("revWriteBtn");

    if (revText) {
      revText.textContent = (lang === "en" && textEn) ? textEn : (textIt || "Leggi tutte le recensioni reali su Google oppure lasciaci la tua.");
    }

    if (readBtn) {
      readBtn.href = googleLink || "https://www.google.com/search?q=greenwood+matino+recensioni";
    }

    if (writeBtn) {
      writeBtn.href = writeLink || "https://maps.app.goo.gl/CTUsD7FwFHq6K897A?g_st=ic";
    }
  } catch (e) {
    console.warn("Errore caricamento recensioni:", e);
  }
})();
</script>

</main>
</body>
</html>
